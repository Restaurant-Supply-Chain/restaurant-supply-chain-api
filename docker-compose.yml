services:
  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-rsc_db}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
